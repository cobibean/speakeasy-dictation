name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:renderer
      - run: npm run build:main
      - name: Verify default BYOK configuration
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config = JSON.parse(fs.readFileSync('dist/main/main/product-public-config.json'));
          assert.equal(config.edition, 'oss');
          assert.equal(config.buildProfile, 'oss');
          assert.equal(config.productApiBaseUrl, '');
          assert.equal(config.productUpdateUrl, '');
          assert.equal(config.ossUpdateUrl, '');
          JS
